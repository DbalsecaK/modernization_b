[project]
name = "nexti-model-gateway"
version = "0.1.0"
description = "The only way the platform reaches AI model providers: policy, profile, fallback, budget and usage ledger (spec 12.7, rule 2)."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "nexti-core",
]

[tool.uv.sources]
nexti-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_model_gateway"]
