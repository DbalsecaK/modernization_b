[project]
name = "nexti-verification"
version = "0.1.0"
description = "Independent verification (spec 11.3): comparison with masks, fresh inputs, the verdict computed by code with fixed rules and the proof pack."
requires-python = ">=3.12"
dependencies = ["nexti-core"]

[tool.uv.sources]
nexti-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_verification"]
