[project]
name = "nexti-ivv"
version = "0.1.0"
description = "Independent validation of a third party's migration (Flow 4, ADR-0025): the target's inventory, the interface mapping and the black-box run of the golden master."
requires-python = ">=3.12"
dependencies = ["nexti-core", "nexti-sandbox", "nexti-verification", "pyyaml>=6.0"]

[tool.uv.sources]
nexti-core = { workspace = true }
nexti-sandbox = { workspace = true }
nexti-verification = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_ivv"]
