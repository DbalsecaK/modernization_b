[project]
name = "nexti-delivery"
version = "0.1.0"
description = "Delivery of the generated project (spec 6.1 phase 13, 6.3, ADR-0023): the strangler fig cutover plan and the push of the release to a new branch of the customer's repository."
requires-python = ">=3.12"
dependencies = ["dulwich>=1.2.15,<2", "nexti-core"]

[tool.uv.sources]
nexti-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_delivery"]
