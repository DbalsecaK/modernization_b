[project]
name = "nexti-ui"
version = "0.1.0"
description = "Prototypes of the UI phase (spec 7.4, ADR-0013): validation of generated screens, build in the web sandbox and the NexTI base tokens."
requires-python = ">=3.12"
dependencies = ["nexti-sandbox"]

[tool.uv.sources]
nexti-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_ui"]
