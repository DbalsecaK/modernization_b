[project]
name = "nexti-pack-iac"
version = "0.1.0"
description = "Deployment pack: OpenTofu for AWS, Azure and GCP (containers or serverless) generated from the design, validated in the sandbox with fitness functions (spec 8.4, ADR-0021, ADR-0027)."
requires-python = ">=3.12"
dependencies = ["nexti-core", "nexti-sandbox", "nexti-verification"]

[tool.uv.sources]
nexti-core = { workspace = true }
nexti-sandbox = { workspace = true }
nexti-verification = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_pack_iac"]
