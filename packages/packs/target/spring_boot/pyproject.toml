[project]
name = "nexti-pack-spring-boot"
version = "0.1.0"
description = "Target pack Java Spring Boot + PostgreSQL: design, deterministic generators and sandbox build (spec 8.4, ADR-0010)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11", "nexti-core", "nexti-sandbox"]

[tool.uv.sources]
nexti-core = { workspace = true }
nexti-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_pack_spring_boot"]
