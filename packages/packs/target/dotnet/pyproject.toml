[project]
name = "nexti-pack-dotnet"
version = "0.1.0"
description = "Target pack .NET 10 + SQL Server: deterministic generators, sandbox build, equivalence harness and canary (spec 8.4, ADR-0017)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11", "nexti-core", "nexti-sandbox"]

[tool.uv.sources]
nexti-core = { workspace = true }
nexti-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_pack_dotnet"]
