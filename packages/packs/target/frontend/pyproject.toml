[project]
name = "nexti-pack-frontend"
version = "0.1.0"
description = "Frontend target packs React and Angular: OpenAPI and typed client from the design, screen contract and harness in the sandbox (spec 8.4, ADR-0016)."
requires-python = ">=3.12"
dependencies = ["nexti-core", "nexti-pack-spring-boot", "nexti-sandbox"]

[tool.uv.sources]
nexti-core = { workspace = true }
nexti-pack-spring-boot = { workspace = true }
nexti-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_pack_frontend"]
