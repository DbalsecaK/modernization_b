[project]
name = "nexti-core"
version = "0.1.0"
description = "Shared domain of the NexTI platform: tenancy types, permission catalog and the database layer."
requires-python = ">=3.12"
dependencies = ["sqlalchemy[asyncio]>=2.1", "structlog>=26.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_core"]
