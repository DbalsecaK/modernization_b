[project]
name = "nexti-core"
version = "0.1.0"
description = "Shared domain of the NexTI platform: tenancy, permission catalog, project composition, the spec and the database layer."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46",
    "httpx>=0.28",
    "minio>=7.2",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1",
    "urllib3>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_core"]
