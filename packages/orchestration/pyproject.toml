[project]
name = "nexti-orchestration"
version = "0.1.0"
description = "LangGraph composition of the project pipeline: phases, gates, questions and do-verify-correct (spec 10, 11.1)."
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg[binary]>=3.2",
  "nexti-adapter-sybase",
  "nexti-agents",
  "nexti-core",
  "nexti-pack-spring-boot",
  "nexti-sandbox",
]

[tool.uv.sources]
nexti-adapter-sybase = { workspace = true }
nexti-agents = { workspace = true }
nexti-core = { workspace = true }
nexti-pack-spring-boot = { workspace = true }
nexti-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_orchestration"]
