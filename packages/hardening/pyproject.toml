[project]
name = "nexti-hardening"
version = "0.1.0"
description = "Hardening of the generated project (spec 6.1 phase 12, ADR-0023): secrets, vulnerable dependencies, insecure patterns and slow tests, computed by code."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "nexti-sandbox"]

[tool.uv.sources]
nexti-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_hardening"]
