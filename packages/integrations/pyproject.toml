[project]
name = "nexti-integrations"
version = "0.1.0"
description = "The customer's backlog in Jira or Azure DevOps (spec 7.6, ADR-0019)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_integrations"]
