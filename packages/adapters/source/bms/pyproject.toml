[project]
name = "nexti-adapter-bms"
version = "0.1.0"
description = "Source adapter for CICS BMS maps: deterministic parsing of DFHMSD/DFHMDI/DFHMDF into screen specs (spec 8.3)."
requires-python = ">=3.12"
dependencies = ["nexti-core"]

[tool.uv.sources]
nexti-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_adapter_bms"]
