[project]
name = "nexti-adapter-rpg"
version = "0.1.0"
description = "Source adapter for RPG / IBM i: deterministic parsing of RPG III, RPG IV fixed, mixed and fully free programs, DDS (PF, LF, DSPF, PRTF) and CL (spec 8.2, ADR-0051)."
requires-python = ">=3.12"
dependencies = ["nexti-core", "nexti-adapter-cobol"]

[tool.uv.sources]
nexti-core = { workspace = true }
nexti-adapter-cobol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_adapter_rpg"]
