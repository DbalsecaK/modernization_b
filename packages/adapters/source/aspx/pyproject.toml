[project]
name = "nexti-adapter-aspx"
version = "0.1.0"
description = "Source adapter for ASP.NET WebForms: deterministic parsing of pages, code-behind and App_Code, screens with validators, traces and the uplift assessment (spec 8.3, ADR-0020)."
requires-python = ">=3.12"
dependencies = ["nexti-core", "nexti-adapter-cobol"]

[tool.uv.sources]
nexti-core = { workspace = true }
nexti-adapter-cobol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_adapter_aspx"]
