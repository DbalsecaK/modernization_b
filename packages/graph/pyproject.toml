[project]
name = "nexti-graph"
version = "0.1.0"
description = "The only access layer to the knowledge graph (Neo4j), with mandatory tenant and project filters (spec 5.3)."
requires-python = ">=3.12"
dependencies = ["neo4j>=5.28", "nexti-core"]

[tool.uv.sources]
nexti-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_graph"]
