[project]
name = "nexti-worker"
version = "0.1.0"
description = "Workers that run the project pipelines from the Procrastinate queue (spec 10.3, ADR-0009)."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "procrastinate>=3.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.10",
  "structlog>=25.4",
  "nexti-adapter-bms",
  "nexti-adapter-cobol",
  "nexti-adapter-sybase",
  "nexti-core",
  "nexti-pack-spring-boot",
  "nexti-graph",
  "nexti-ingest",
  "nexti-model-gateway",
  "nexti-orchestration",
  "nexti-sandbox",
  "nexti-ui",
  "nexti-verification",
]

[tool.uv.sources]
nexti-adapter-bms = { workspace = true }
nexti-adapter-cobol = { workspace = true }
nexti-adapter-sybase = { workspace = true }
nexti-core = { workspace = true }
nexti-pack-spring-boot = { workspace = true }
nexti-graph = { workspace = true }
nexti-ingest = { workspace = true }
nexti-model-gateway = { workspace = true }
nexti-orchestration = { workspace = true }
nexti-sandbox = { workspace = true }
nexti-ui = { workspace = true }
nexti-verification = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_worker"]
