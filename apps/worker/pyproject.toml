[project]
name = "nexti-worker"
version = "0.1.0"
description = "Workers that run the project pipelines from the Procrastinate queue (spec 10.3, ADR-0009)."
requires-python = ">=3.12"
dependencies = [
  "procrastinate>=3.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.10",
  "nexti-core",
  "nexti-ingest",
  "nexti-orchestration",
]

[tool.uv.sources]
nexti-core = { workspace = true }
nexti-ingest = { workspace = true }
nexti-orchestration = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_worker"]
