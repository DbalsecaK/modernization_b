[project]
name = "nexti-api"
version = "0.1.0"
description = "NexTI platform API and BFF (FastAPI)."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "asyncpg>=0.31",
  "fastapi>=0.118",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "redis>=8.1",
  "sqlalchemy[asyncio]>=2.1",
  "structlog>=26.1",
  "uvicorn[standard]>=0.37",
  "nexti-core",
]

[tool.uv.sources]
nexti-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_api"]
