[project]
name = "nexti-api"
version = "0.1.0"
description = "NexTI platform API and BFF (FastAPI)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "uvicorn[standard]>=0.37",
  "nexti-core",
]

[dependency-groups]
dev = ["httpx>=0.28"]

[tool.uv.sources]
nexti-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexti_api"]
