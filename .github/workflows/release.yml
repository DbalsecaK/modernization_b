# Release of the platform's images (spec 15.7, ADR-0024): on main and on version tags, the images are built, pushed to
# GitHub Container Registry, signed with cosign keyless (GitHub's OIDC, no key to keep) and their SBOM attested.
# Pull requests never publish images (ci.yml builds them and makes their SBOM).
name: Release images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write  # cosign keyless

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  COSIGN: gcr.io/projectsigstore/cosign:v2.6.1@sha256:68839b7f13dac5a6744a5d8818e984dd39183374e37855c19e14d623d9bc9037
  SYFT: anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357

jobs:
  images:
    name: Build, push, sign and attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: version
        run: |
          registry="$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else echo "tag=main-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"; fi
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push the platform and sandbox images
        env:
          R: ${{ steps.version.outputs.registry }}
          T: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          r="$R"; t="$T"
          build() { docker build -q -t "$r/$1:$t" "${@:2}" && docker push -q "$r/$1:$t"; }
          build nexti-migrate -f infra/images/api/Dockerfile --target migrate .
          build nexti-api -f infra/images/api/Dockerfile --target api --build-arg NEXTI_VERSION="$t" .
          build nexti-worker -f infra/images/worker/Dockerfile --build-arg NEXTI_VERSION="$t" .
          build nexti-web -f infra/images/web/Dockerfile .
          build nexti-keycloak infra/keycloak
          # The sandboxes the worker pulls into its daemon (infra/helm/nexti, worker.sandbox.images).
          docker build -q -t "$r/nexti-sandbox-java:2" infra/sandbox/java && docker push -q "$r/nexti-sandbox-java:2"
          docker build -q -t "$r/nexti-sandbox-java-oracle:1" infra/sandbox/java-oracle && docker push -q "$r/nexti-sandbox-java-oracle:1"
          docker build -q -t "$r/nexti-sandbox-java-mysql:1" infra/sandbox/java-mysql && docker push -q "$r/nexti-sandbox-java-mysql:1"
          docker build -q -t "$r/nexti-sandbox-java-quarkus:1" infra/sandbox/java-quarkus && docker push -q "$r/nexti-sandbox-java-quarkus:1"
          docker build -q -t "$r/nexti-sandbox-dotnet:1" infra/sandbox/dotnet && docker push -q "$r/nexti-sandbox-dotnet:1"
          docker build -q -t "$r/nexti-sandbox-frontend:2" -f infra/sandbox/frontend/Dockerfile . && docker push -q "$r/nexti-sandbox-frontend:2"
          docker build -q -t "$r/nexti-sandbox-web:1" -f infra/sandbox/web/Dockerfile . && docker push -q "$r/nexti-sandbox-web:1"
          docker build -q -t "$r/nexti-sandbox-docs:1" infra/sandbox/docs && docker push -q "$r/nexti-sandbox-docs:1"
          docker build -q -t "$r/nexti-sandbox-iac:2" infra/sandbox/iac && docker push -q "$r/nexti-sandbox-iac:2"
          docker build -q -t "$r/nexti-sandbox-hardening:1" infra/sandbox/hardening && docker push -q "$r/nexti-sandbox-hardening:1"
      - name: Sign and attest the SBOM (cosign keyless)
        env:
          R: ${{ steps.version.outputs.registry }}
          T: ${{ steps.version.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          r="$R"; t="$T"
          mkdir -p sbom
          for image in nexti-migrate nexti-api nexti-worker nexti-web nexti-keycloak; do
            ref="$r/$image@$(docker inspect --format '{{index .RepoDigests 0}}' "$r/$image:$t" | cut -d@ -f2)"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT" "$r/$image:$t" -o spdx-json -q > "sbom/$image.spdx.json"
            # cosign's image runs without root and cannot read the runner's Docker credentials: flags.
            docker run --rm -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN "$COSIGN" sign --yes \
              --registry-username "$ACTOR" --registry-password "$TOKEN" "$ref"
            docker run --rm -v "$PWD/sbom:/sbom:ro" -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              "$COSIGN" attest --yes --registry-username "$ACTOR" --registry-password "$TOKEN" \
              --type spdxjson --predicate "/sbom/$image.spdx.json" "$ref"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.version.outputs.tag }}
          path: sbom
          retention-days: 90
