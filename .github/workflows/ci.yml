# CI of the platform (spec 15.7, plan M0 section 10): lint, types, tests, OpenFGA model tests, end-to-end with the
# real services (the runs e2e starts a worker, M3), SAST, SCA and secret scanning. Every job must pass before merging
# to main.
# Third-party actions are pinned to a commit SHA (a tag can be moved); the comment says which release it is.
name: CI

on:
  push:
    branches: [main, m0-fundaciones]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f infra/docker-compose/compose.yaml
  # The execution sandbox of the worker (M3, spec 15.5): the image pinned in packages/sandbox, pulled once per job.
  SANDBOX_IMAGE: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
  # The services the API needs (Langfuse is not used yet; MinIO and ClamAV hold and scan the inputs, M2; Neo4j is the
  # knowledge graph, M4).
  SERVICES: postgres redis keycloak openfga openbao minio clamav mailpit neo4j

jobs:
  python-quality:
    name: Python · lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src apps/api/tests packages/core/src packages/core/tests packages/model_gateway/src packages/model_gateway/tests packages/agents/src packages/skills/src packages/ingest/src packages/ingest/tests packages/integrations/src packages/integrations/tests packages/sandbox/src packages/sandbox/tests packages/orchestration/src packages/orchestration/tests packages/adapters/source/sybase/src packages/adapters/source/sybase/tests packages/adapters/source/bms/src packages/adapters/source/bms/tests packages/adapters/source/cobol/src packages/adapters/source/cobol/tests packages/adapters/source/aspx/src packages/adapters/source/aspx/tests packages/adapters/source/rpg/src packages/adapters/source/rpg/tests packages/graph/src packages/graph/tests packages/packs/target/spring_boot/src packages/packs/target/spring_boot/tests packages/packs/target/dotnet/src packages/packs/target/dotnet/tests packages/packs/target/go/src packages/packs/target/go/tests packages/packs/target/frontend/src packages/packs/target/frontend/tests packages/packs/deploy/opentofu/src packages/packs/deploy/opentofu/tests packages/hardening/src packages/hardening/tests packages/delivery/src packages/delivery/tests packages/ivv/src packages/ivv/tests packages/verification/src packages/verification/tests packages/ui/src packages/ui/tests apps/worker/src apps/worker/tests

  web:
    name: Web · lint, types, tests, build, generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @nexti/web typecheck
      - run: pnpm web:test
      - run: pnpm web:build
      - name: The web client types match the API
        run: |
          uv sync --all-packages --locked
          pnpm api:types
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/schema.d.ts

  openfga:
    name: OpenFGA · model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Allowed and denied cases
        run: docker run --rm -v "$PWD/infra/openfga:/model" openfga/cli:v0.8.1 model test --tests /model/model.tests.yaml
      - name: model.json is generated from model.fga
        run: |
          docker run --rm -v "$PWD/infra/openfga:/model" openfga/cli:v0.8.1 model transform --file /model/model.fga > /tmp/model.json
          diff <(jq -S . /tmp/model.json) <(jq -S . infra/openfga/model.json)

  backend-tests:
    name: API · tests with the real services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --all-packages --locked
      - name: Local services
        run: |
          python3 infra/docker-compose/init_env.py
          # shellcheck disable=SC2086 # the list of services must be split
          $COMPOSE up -d --wait $SERVICES
          docker pull "$SANDBOX_IMAGE"
          # The Java sandbox of the Spring Boot pack (M4): Temurin 21 with the pack's libraries, no network at run time.
          docker build -q -t nexti-sandbox-java:2 infra/sandbox/java
          # The web sandbox of the prototypes (M5, ADR-0013): Node, esbuild, React and the NexTI design system.
          docker build -q -f infra/sandbox/web/Dockerfile -t nexti-sandbox-web:1 .
          # The frontend packs sandbox (M6b, ADR-0016; M13, ADR-0028): TypeScript, React, Angular AOT, Next.js, jsdom and axe-core.
          docker build -q -f infra/sandbox/frontend/Dockerfile -t nexti-sandbox-frontend:2 .
          # The .NET 10 pack sandbox (M6c, ADR-0017): the .NET SDK on SQL Server 2025, NuGet restored at build time.
          docker build -q -t nexti-sandbox-dotnet:1 infra/sandbox/dotnet
          # The Go pack sandbox (M14, ADR-0029): Go 1.26 with shopspring/decimal and pgx in an offline module cache, PostgreSQL on loopback.
          docker build -q -t nexti-sandbox-go:1 infra/sandbox/go
          # The document converter (M7, ADR-0018): Word and Excel with the standard library, PDF with pypdf.
          docker build -q -t nexti-sandbox-docs:1 infra/sandbox/docs
          # The Spring Boot pack on Oracle (M8b, ADR-0021): Oracle Database Free 23ai with the JDK and ojdbc11.
          docker build -q -t nexti-sandbox-java-oracle:1 infra/sandbox/java-oracle
          # The .NET pack on Oracle (M16, ADR-0031): Oracle Database Free 23ai with the .NET 10 SDK and ODP.NET restored offline.
          docker build -q -t nexti-sandbox-dotnet-oracle:1 infra/sandbox/dotnet-oracle
          # The Spring Boot pack on MySQL (M12, ADR-0027): MySQL 8.4 on loopback with the JDK and Connector/J.
          docker build -q -t nexti-sandbox-java-mysql:1 infra/sandbox/java-mysql
          # The Spring Boot pack on MongoDB (M14, ADR-0029): mongod 8.0 as a single-node replica set on loopback with the JDK and the sync driver.
          docker build -q -t nexti-sandbox-java-mongodb:1 infra/sandbox/java-mongodb
          # The Java pack with Quarkus (M13, ADR-0028): PostgreSQL on loopback with the JDK and the Quarkus 3.40 LTS libraries.
          docker build -q -t nexti-sandbox-java-quarkus:1 infra/sandbox/java-quarkus
          # The deployment pack (M8b, ADR-0021; M12, ADR-0027): OpenTofu with the AWS, Azure, Google and random providers mirrored offline.
          docker build -q -t nexti-sandbox-iac:2 infra/sandbox/iac
          # The hardening sandbox (M9a, ADR-0023): gitleaks over the generated files, without network.
          docker build -q -t nexti-sandbox-hardening:1 infra/sandbox/hardening
      # Includes the M3 acceptance: worker processes (python -m nexti_worker) killed and replaced, and generated code
      # tested in the Docker sandbox.
      - run: uv run pytest
        env:
          # M1 acceptance against the real OpenRouter API (a few millionths of a dollar); skipped when empty.
          OPENROUTER_API_KEY_FOR_TESTS: ${{ secrets.OPENROUTER_API_KEY_FOR_TESTS }}
      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --tail 200

  e2e:
    name: Web · end to end (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - name: Local services, schema and development data
        run: |
          python3 infra/docker-compose/init_env.py
          # shellcheck disable=SC2086 # the list of services must be split
          $COMPOSE up -d --wait $SERVICES
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run python -m nexti_api.cli seed-dev
          docker pull "$SANDBOX_IMAGE"
          # The UI design test compiles a real prototype in the web sandbox (M5, ADR-0013).
          docker build -q -f infra/sandbox/web/Dockerfile -t nexti-sandbox-web:1 .
      - run: pnpm --filter @nexti/web exec playwright install --with-deps chromium
      - run: pnpm web:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  security:
    name: Security · secrets, SAST, SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks, whole history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: SAST (Semgrep)
        run: >
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.178.0
          semgrep scan --config p/ci --error --metrics off
          --exclude node_modules --exclude .venv --exclude '*.d.ts' --exclude openapi.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: SCA Python (pip-audit)
        run: |
          uv export --all-packages --no-dev --no-hashes --no-emit-workspace --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --progress-spinner off
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: SCA JavaScript (pnpm audit)
        run: pnpm audit --prod --audit-level high

  platform:
    name: Platform · images and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The platform in containers (ADR-0024): the images of infra/images with the services of development.
      - name: Build the images
        run: |
          python3 infra/docker-compose/init_env.py
          $COMPOSE --profile platform build migrate api worker web
      - name: Start the platform
        run: $COMPOSE --profile platform up -d --wait migrate api worker web
      - name: The web serves the app and, on the same origin, the API
        run: |
          curl -fsS http://127.0.0.1:5173/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:5173/api/v1/health/live | grep -q '"ok"'
          curl -fsSI http://127.0.0.1:5173/ | grep -qi 'content-security-policy'
          test "$(docker inspect -f '{{.State.Running}}' nexti-platform-worker-1)" = true
      # DAST (15.7, ADR-0024): ZAP's baseline (passive) scan of the running web and its API. The rules the platform
      # meets fail the build if they regress (infra/dast/zap-rules.tsv); the rest are reported.
      - name: DAST (OWASP ZAP baseline)
        run: |
          mkdir -p /tmp/zap && chmod 777 /tmp/zap
          docker run --rm --network host -v /tmp/zap:/zap/wrk:rw -v "$PWD/infra/dast:/zap/rules:ro" \
            ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab \
            zap-baseline.py -t http://127.0.0.1:5173 -c /zap/rules/zap-rules.tsv -I -r zap-report.html
      # SBOM of each image (SPDX), kept with the run; the images of main are signed by the release workflow.
      - name: SBOM (Syft)
        run: |
          mkdir -p /tmp/sbom
          for image in nexti-migrate nexti-api nexti-worker nexti-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 "$image:dev" -o spdx-json -q > "/tmp/sbom/$image.spdx.json"
            test -s "/tmp/sbom/$image.spdx.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: platform-sbom-and-dast
          path: |
            /tmp/sbom
            /tmp/zap/zap-report.html
          retention-days: 14
      - name: Logs
        if: failure()
        run: $COMPOSE --profile platform logs --tail 200 migrate api worker web

  helm:
    name: Platform · Helm chart and profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The chart and each deployment profile (ADR-0024): lint, render and validate against the Kubernetes schema.
      - name: Lint, render and validate
        run: |
          HELM="docker run --rm -v $PWD/infra/helm:/charts alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9"
          $HELM lint --strict /charts/nexti
          mkdir -p /tmp/manifests
          for profile in shared-saas dedicated-saas customer-cloud on-prem air-gapped; do
            $HELM template nexti /charts/nexti -f /charts/nexti/profiles/$profile.yaml > /tmp/manifests/$profile.yaml
          done
          docker run --rm -v /tmp/manifests:/m ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary -kubernetes-version 1.31.0 /m
