{{- if and .Values.controlPlane.enabled .Values.ingress.enabled }}
# One origin for the web and its API (the BFF's cookie and Origin check); TLS at the ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nexti.fullname" . }}
  labels:
    {{- include "nexti.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nexti.fullname" . }}-web
                port: {name: http}
{{- end }}
