{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexti.fullname" . }}-api
  labels:
    {{- include "nexti.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "nexti.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "nexti.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "nexti.image" (list . "nexti-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8100}
          securityContext:
            {{- include "nexti.containerSecurity" . | nindent 12 }}
          env:
            {{- include "nexti.env" . | nindent 12 }}
            {{- if .Values.license.enabled }}
            # Offline license (14.4, ADR-0030): verified at start-up; invalid or expired leaves the platform read-only.
            - name: LICENSE_FILE
              value: /etc/nexti/license/license.json
            - name: LICENSE_SIGNATURE_FILE
              value: /etc/nexti/license/license.json.sig
            - name: LICENSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.license.secretName | quote }}, key: public-key}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          readinessProbe:
            httpGet: {path: /api/v1/health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/v1/health/live, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.license.enabled }}
            - {name: license, mountPath: /etc/nexti/license, readOnly: true}
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- if .Values.license.enabled }}
        - name: license
          secret:
            secretName: {{ .Values.license.secretName | quote }}
            items:
              - {key: license.json, path: license.json}
              - {key: license.json.sig, path: license.json.sig}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexti.fullname" . }}-api
  labels:
    {{- include "nexti.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 8100, targetPort: http}
{{- end }}
