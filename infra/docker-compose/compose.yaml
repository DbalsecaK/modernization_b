# Local development environment (spec 19.2, M0). Every port is bound to 127.0.0.1 only.
# Copy .env.example to .env first. Langfuse and ClickHouse run only with: --profile observability
name: nexti-platform

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 5s

services:
  postgres:
    image: docker.io/library/postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:?set in .env}
      PLATFORM_APP_PASSWORD: ${PLATFORM_APP_PASSWORD:?set in .env}
      AUTHZ_RELAY_PASSWORD: ${AUTHZ_RELAY_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD:?set in .env}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5440}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]

  redis:
    image: docker.io/library/redis:8.8.3-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--maxmemory-policy", "noeviction"]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6380}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  keycloak:
    # Keycloak 26.7.4 with the platform's login theme built with Keycloakify (ADR-0022): infra/keycloak/Dockerfile.
    build: ../keycloak
    image: nexti-keycloak:1
    # Development mode with the realm imported on start (spec 15.1, D-27). Existing realms are not overwritten.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      # Placeholders resolved by the realm import:
      KC_BFF_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET:?set in .env}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:?set in .env}
      KC_DEV_USER_PASSWORD: ${KC_DEV_USER_PASSWORD:?set in .env}
      KC_IDP_TEST_CLIENT_SECRET: ${KC_IDP_TEST_CLIENT_SECRET:?set in .env}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8180}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8180}:8080
    volumes:
      - ../keycloak/realm-nexti.json:/opt/keycloak/data/import/realm-nexti.json:ro
      # The test identity provider (ADR-0022): a second realm the realm nexti brokers to, like Entra ID or Okta.
      - ../keycloak/realm-idp-test.json:/opt/keycloak/data/import/realm-idp-test.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      retries: 40
      # The image has no curl; ask the management port directly.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3

  openfga-migrate:
    image: docker.io/openfga/openfga:v1.21.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: docker.io/openfga/openfga:v1.21.0
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_API_KEY:?set in .env}
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
    ports:
      - 127.0.0.1:${OPENFGA_HTTP_PORT:-8190}:8080
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]

  neo4j:
    image: docker.io/library/neo4j:5.26.31-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in .env}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - 127.0.0.1:${NEO4J_HTTP_PORT:-7476}:7474
      - 127.0.0.1:${NEO4J_BOLT_PORT:-7689}:7687
    volumes:
      - neo4j_data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]

  minio:
    # Chainguard publishes only `latest`; pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    entrypoint: sh
    command: -c 'mkdir -p /data/platform /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports:
      - 127.0.0.1:${MINIO_API_PORT:-9100}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001
    volumes:
      - minio_data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mc", "ready", "local"]

  openbao:
    # Secrets store with the Vault API (ADR-0007). Dev mode keeps secrets in memory: recreating the container
    # means entering the provider API keys again. Production uses Vault or OpenBao with persistent storage.
    image: docker.io/openbao/openbao:2.7.0
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_SECRET:?set in .env}
    cap_add: [IPC_LOCK]
    ports:
      - 127.0.0.1:${OPENBAO_PORT:-8210}:8200
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health || exit 1"]

  clamav:
    # Malware scanning of uploaded inputs (ADR-0008). The first start downloads the signatures (several minutes);
    # the volume keeps them between restarts and freshclam updates them.
    image: docker.io/clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    ports:
      - 127.0.0.1:${CLAMAV_PORT:-3310}:3310
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "clamdcheck.sh"]
      start_period: 600s

  mailpit:
    # Captures outgoing mail (Keycloak invitations and password actions) in development.
    image: docker.io/axllent/mailpit:v1.31.3
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  clickhouse:
    profiles: [observability]
    image: docker.io/clickhouse/clickhouse-server:25.12.11.4
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]

  langfuse-worker:
    profiles: [observability]
    image: docker.langfuse.com/langfuse/langfuse-worker:4.46.0
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3100}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}

  langfuse-web:
    profiles: [observability]
    image: docker.langfuse.com/langfuse/langfuse:4.46.0
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
    ports:
      - 127.0.0.1:${LANGFUSE_PORT:-3100}:3000

  # -- The platform itself in containers (ADR-0024), with `--profile platform`: the images of infra/images, the same
  # services as development. The smoke test of the images and the simplest on-prem installation.
  migrate:
    profiles: ["platform"]
    build: {context: ../.., dockerfile: infra/images/api/Dockerfile, target: migrate}
    image: nexti-migrate:dev
    environment: &platform-env
      APP_ENV: staging
      DATABASE_URL: postgresql+asyncpg://platform_app:${PLATFORM_APP_PASSWORD}@postgres:5432/platform
      MIGRATION_DATABASE_URL: postgresql+asyncpg://platform_owner:${PLATFORM_OWNER_PASSWORD}@postgres:5432/platform
      AUTHZ_RELAY_DATABASE_URL: postgresql+asyncpg://authz_relay:${AUTHZ_RELAY_PASSWORD}@postgres:5432/platform
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8180}
      OIDC_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET}
      SECRETS_URL: http://openbao:8200
      SECRETS_TOKEN: ${OPENBAO_DEV_ROOT_SECRET}
      OBJECT_STORE_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MALWARE_SCANNER_HOST: clamav
      MALWARE_SCANNER_PORT: "3310"
      OPENFGA_URL: http://openfga:8080
      OPENFGA_API_KEY: ${OPENFGA_API_KEY}
      OPENFGA_BOOTSTRAP: "true"
      GRAPH_URI: bolt://neo4j:7687
      GRAPH_USER: neo4j
      GRAPH_PASSWORD: ${NEO4J_PASSWORD}
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["platform"]
    build: {context: ../.., dockerfile: infra/images/api/Dockerfile, target: api}
    image: nexti-api:dev
    environment: *platform-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      openfga:
        condition: service_healthy
      openbao:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health/live', timeout=4)"]

  worker:
    profiles: ["platform"]
    build: {context: ../.., dockerfile: infra/images/worker/Dockerfile}
    image: nexti-worker:dev
    environment:
      <<: *platform-env
      # The host's Docker runs the sandboxes; their inputs go through a directory both see at the same path.
      TMPDIR: /tmp/nexti-sandbox-io
    user: "0:0"  # the Docker socket of the host belongs to root; Kubernetes uses a rootless sidecar instead
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/nexti-sandbox-io:/tmp/nexti-sandbox-io
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["platform"]
    build: {context: ../.., dockerfile: infra/images/web/Dockerfile}
    image: nexti-web:dev
    environment:
      API_UPSTREAM: http://api:8100
    ports:
      - 127.0.0.1:${WEB_PORT:-5173}:8080
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101", "/var/cache/nginx:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]

volumes:
  postgres_data:
  clamav_data:
  redis_data:
  neo4j_data:
  minio_data:
  clickhouse_data:
  clickhouse_logs:
