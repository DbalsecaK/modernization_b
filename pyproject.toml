# Python workspace (uv). Members: the API and the shared packages (spec 19.3).
[tool.uv.workspace]
members = ["apps/api", "packages/core", "packages/model_gateway", "packages/agents", "packages/skills", "packages/ingest"]

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "respx>=0.23",
  "types-pyyaml>=6.0",
  "ruff>=0.13",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["nexti_api", "nexti_core", "nexti_model_gateway", "nexti_agents", "nexti_skills", "nexti_ingest"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/api/src", "packages/core/src", "packages/model_gateway/src", "packages/agents/src", "packages/skills/src", "packages/ingest/src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/core/tests", "packages/model_gateway/tests", "packages/ingest/tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs the local services (docker compose)"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
